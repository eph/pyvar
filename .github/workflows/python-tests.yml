name: Python Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
      - name: Install uv
        run: pip install uv
          uv pip install -r requirements.txt
          uv pip install .
        run: pip install numpy
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install .
      - name: Run test suite
        run: nosetests -q